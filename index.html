<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Showing Weather</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="search">
    <input type="text" placeholder="Enter your City Name" spellcheck="false" />
    <button>
      <img src="https://tse4.mm.bing.net/th?id=OIP.16btkDvaBBJc4Ei7DdKWVAHaIW&pid=Api&P=0&h=180" alt="Search" />
    </button>
  </div>

  <div class="box">
    <div class="weather">
      <img src="https://cdn2.iconfinder.com/data/icons/weather-flat-14/64/weather02-1024.png" class="weather-icon" alt="Weather Icon" />
      <h1 class="temp">22°C</h1>
      <h2 class="City">Lucknow</h2>

      <div class="details">
        <div class="col">
          <img src="https://static.vecteezy.com/system/resources/previews/026/123/610/original/humidity-icon-in-flat-style-climate-illustration-on-white-isolated-background-temperature-forecast-business-concept-vector.jpg" alt="Humidity" />
          <div>
            <p class="Humidity">20%</p>
            <p>Humidity</p>
          </div>
        </div>
        <div class="col">
          <img src="https://static.vecteezy.com/system/resources/previews/007/388/707/original/cloudy-windy-weather-color-icon-clouds-and-wind-overcast-weather-forecast-isolated-illustration-vector.jpg" alt="Wind" />
          <div>
            <p class="Wind">20 km/hr</p>
            <p>Wind Speed</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>


</body>
</html>
